<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydraulic Grip Assist — Project Tracker</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F4F6; --surface:#FFFFFF; --sunk:#E8ECF0; --ink:#16213A; --muted:#566074; --rule:#D3D9E1;
  --orange:#E5531A; --orange-text:#B43C0C; --orange-soft:#FCE6DC;
  --fluid:#1F7A8C; --fluid-soft:#DCEFF2; --good:#2E7D4F; --warn:#A35A00;
  --body:"Barlow", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
  --display:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1521; --surface:#172030; --sunk:#1E2838; --ink:#E6EAF0; --muted:#A0AABB; --rule:#2C3749;
    --orange:#FF6A33; --orange-text:#FF916A; --orange-soft:#3A2218;
    --fluid:#53B8C9; --fluid-soft:#16323A; --good:#5CC18A; --warn:#F0A64A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1521; --surface:#172030; --sunk:#1E2838; --ink:#E6EAF0; --muted:#A0AABB; --rule:#2C3749;
  --orange:#FF6A33; --orange-text:#FF916A; --orange-soft:#3A2218;
  --fluid:#53B8C9; --fluid-soft:#16323A; --good:#5CC18A; --warn:#F0A64A;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
a{color:var(--fluid)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* Header */
header.top{padding:28px 0 0}
.title-row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.1rem);line-height:1.02;margin:0;letter-spacing:.005em;max-width:16ch}
.byline{color:var(--muted);margin:10px 0 0;font-size:.95rem}
.sync{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.shared{background:var(--good)} .dot.local{background:var(--warn)} .dot.err{background:var(--orange)}

/* Week strip — the signature element */
.strip{margin:26px 0 0;position:relative}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.weeknum{font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}
.weeknum span{color:var(--muted);font-weight:600;font-size:1rem;margin-left:6px}
.phase-now{color:var(--muted);font-size:.92rem;text-align:right}
.track{position:relative;height:46px;background:var(--sunk);border-radius:4px;overflow:hidden}
.seg{position:absolute;top:0;bottom:0;border-right:1px solid var(--paper);display:flex;align-items:flex-end;padding:0 4px 4px;font-size:.7rem;color:var(--muted);overflow:hidden;white-space:nowrap}
.seg .fill{position:absolute;left:0;top:0;bottom:0;background:var(--fluid-soft)}
.seg .lbl{position:relative}
.tick{position:absolute;top:0;bottom:0;width:3px;background:var(--orange);margin-left:-1px}
.tick::after{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--orange)}
.weekscale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}

/* Tabs */
nav.tabs{display:flex;gap:2px;margin:24px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin}
nav.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
nav.tabs button:hover{color:var(--ink)}

main{padding:26px 0 60px}
h2{font-family:var(--display);font-weight:700;font-size:1.7rem;margin:0 0 6px;line-height:1.1}
h3{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0 0 8px;line-height:1.15}
p{margin:0 0 12px;max-width:72ch}
.lede{color:var(--muted);max-width:68ch;margin-bottom:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.panel.flat{background:transparent;border-style:dashed}
.stat .v{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1}
.stat .k{color:var(--muted);font-size:.88rem;margin-top:4px}
.section{margin-top:30px}
.muted{color:var(--muted)}
.small{font-size:.88rem}

/* Checklists */
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--rule)}
.check:first-of-type{border-top:0}
.check input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--fluid);flex:none}
.check label{flex:1;cursor:pointer}
.check.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule)}
.check .why{display:block;font-size:.88rem;color:var(--muted);text-decoration:none}
.xbtn{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;padding:2px 6px}
.xbtn:hover{color:var(--orange-text)}

/* Phases */
.phase{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--rule)}
.phase:first-child{border-top:0}
.phase .wk{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.1}
.phase .wk small{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;color:var(--muted);margin-top:4px}
.badge{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);margin-left:8px;vertical-align:middle}
.badge.now{background:var(--orange-soft);color:var(--orange-text)}
.badge.done{background:var(--fluid-soft);color:var(--fluid)}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1;min-width:0}
@media (max-width:620px){.phase{grid-template-columns:1fr;gap:6px}}

/* Forms */
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%}
textarea{min-height:80px;resize:vertical}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:end}
.form label{font-size:.82rem;color:var(--muted);display:block}
.form .wide{grid-column:1/-1}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.82rem;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td input,td select{min-width:90px}
.added{font-size:.75rem;color:var(--orange-text);font-weight:600}
tfoot td{font-weight:600;background:var(--sunk)}

/* SWOT */
.swot{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.swot>div{padding:18px 20px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.swot>div:nth-child(2n){border-right:0}
.swot>div:nth-child(n+3){border-bottom:0}
.swot h3{display:flex;align-items:center;gap:10px}
.swot h3 .letter{font-size:1.9rem;line-height:1;color:var(--fluid)}
.swot .neg h3 .letter{color:var(--orange-text)}
.swot ul{margin:0;padding-left:18px}
.swot li{margin:0 0 8px}
@media (max-width:700px){.swot{grid-template-columns:1fr}.swot>div{border-right:0!important;border-bottom:1px solid var(--rule)!important}.swot>div:last-child{border-bottom:0!important}}

/* Calculator */
.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.calc-out .stat{background:var(--sunk);border-radius:4px;padding:12px}
.calc-out .stat .v{font-size:1.5rem}
.alert{border-left:4px solid var(--orange);background:var(--orange-soft);padding:10px 14px;border-radius:0 4px 4px 0;margin-top:12px;font-size:.93rem}
.ok{border-left:4px solid var(--fluid);background:var(--fluid-soft);padding:10px 14px;border-radius:0 4px 4px 0;margin-top:12px;font-size:.93rem}
svg.schem{width:100%;height:auto;max-width:720px;display:block}
svg.schem text{font-family:var(--body);font-size:13px;fill:var(--muted)}

.banner{background:var(--orange-soft);color:var(--ink);border-radius:6px;padding:10px 14px;margin-top:16px;font-size:.92rem;display:none}
.banner.show{display:block}
.note{border-top:1px solid var(--rule);padding:14px 0}
.note .meta{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.note .body{white-space:pre-wrap;margin-top:4px}
.refs li{margin-bottom:8px;font-size:.92rem}
.bar{height:14px;background:var(--fluid);border-radius:2px}
.barrow{display:grid;grid-template-columns:170px 1fr 70px;gap:10px;align-items:center;font-size:.9rem;margin:6px 0}
@media (max-width:520px){.barrow{grid-template-columns:110px 1fr 56px}}
.gate{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden],#app[hidden]{display:none}
.gate-box{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:26px 28px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stack label{font-size:.85rem;color:var(--muted)}
.stack label.inline{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:.92rem;margin:4px 0}
.stack .btn{align-self:flex-start;margin-top:6px}
fieldset{border:1px solid var(--rule);border-radius:6px;padding:12px 14px 14px;margin:0 0 6px;display:flex;flex-direction:column;gap:6px}
legend{font-family:var(--display);font-weight:600;font-size:1.05rem;padding:0 6px}
.gate-msg{min-height:1.4em;margin:4px 0 0;font-size:.92rem}
a.btn{text-decoration:none;display:inline-block}
.sync .sep{color:var(--rule)}
/* Editing */
.small-btn{padding:4px 10px;font-size:.82rem;margin-left:6px}
#editToggle[aria-pressed="true"]{background:var(--orange);color:#fff;border-color:var(--orange)}
.edit-hint{background:var(--orange-soft);border-radius:4px;padding:8px 12px;font-size:.9rem;margin:0 0 16px}
.edit-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.edit-row input[type=text],.edit-row textarea{flex:1;min-width:0}
.edit-row textarea{min-height:52px}
.edit-list .addrow{margin-top:10px}
.sugg-edit{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--rule)}
.sugg-edit:first-of-type{border-top:0}
.sugg-edit .row{display:flex;justify-content:space-between;align-items:center}
label.inline{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
td input.mt{margin-top:6px}

/* Schedule */
.ms{position:absolute;top:4px;width:12px;height:12px;margin-left:-6px;background:var(--surface);border:2px solid var(--ink);transform:rotate(45deg);z-index:2}
.nextms{display:block;color:var(--orange-text);font-size:.85rem}
.ms-row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--rule);align-items:baseline}
.ms-row:first-of-type{border-top:0}
.ms-row.past{color:var(--muted)}
.ms-date{font-weight:600}
.phase .wk small+small{margin-top:2px}
.wk-edit{display:block;font-family:var(--body);font-weight:500;font-size:.78rem;color:var(--muted);margin-top:8px}
.wk-edit input{margin-top:2px;font-size:.85rem;padding:5px 6px}
.phase{grid-template-columns:150px 1fr}
@media (max-width:620px){.phase{grid-template-columns:1fr}}
.readout{padding:7px 0;font-weight:600}
#settingsBtn[aria-pressed="true"]{border-color:var(--ink)}

/* Read-only */
body.readonly .addrow, body.readonly .panel:has([data-action^="add"]), body.readonly label.btn:has(input[data-import]), body.readonly #importFile, body.readonly label.btn:has(#importFile){display:none}
.people .form{margin-top:6px}
.people details summary{cursor:pointer;font-weight:600}

/* Glossary */
dl.gl{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.gl-item{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.gl-item dt{font-family:var(--display);font-weight:600;font-size:1.15rem}
.gl-item dd{margin:4px 0 0}
.gl-item.gl-done{border-left:4px solid var(--fluid)}
.gl-flags{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px!important;padding-top:8px;border-top:1px solid var(--rule)}
.gl-edit{display:flex;flex-direction:column;gap:6px}
.gl-row{display:flex;gap:6px;align-items:center}
.gl-row input:first-child{flex:2}.gl-row input:nth-child(2){flex:1}
.slide .s-terms{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqw 4cqw;margin:0}
.slide .s-terms dt{font-family:var(--display);font-weight:700;font-size:2cqw;color:var(--s-fluid)}
.slide .s-terms dd{margin:.3cqw 0 0;font-size:1.45cqw;line-height:1.35}

/* Presentation tab */
.pres-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px}
.slide-list{display:flex;flex-direction:column;gap:26px}
.slide-item{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:14px 16px}
.slide-item.off{background:transparent;border-style:dashed}
.slide-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.slide-thumb{max-width:760px;border:1px solid var(--rule)}
.slide-fields{display:grid;gap:10px;margin-top:12px;max-width:760px}
.slide-fields label{font-size:.82rem;color:var(--muted);display:block;margin-bottom:2px}

/* Slides: fixed palette so they look the same in any theme, on a projector and in print */
.slide{--s-bg:#FFFFFF;--s-ink:#16213A;--s-muted:#566074;--s-accent:#E5531A;--s-fluid:#1F7A8C;--s-soft:#EEF2F5;--s-rule:#D3D9E1;
  container-type:inline-size;position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:var(--s-bg);color:var(--s-ink);font-family:var(--body);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.slide .s-inner{position:absolute;inset:0;padding:5cqw 6cqw 6.5cqw;display:flex;flex-direction:column}
.slide .s-foot{position:absolute;left:6cqw;right:6cqw;bottom:2.4cqw;display:flex;justify-content:space-between;font-size:1.15cqw;color:var(--s-muted);border-top:.12cqw solid var(--s-rule);padding-top:.8cqw}
.slide .s-h2{font-family:var(--display);font-weight:700;font-size:4.1cqw;line-height:1.05;margin:0 0 2.6cqw;color:var(--s-ink)}
.slide .s-h3{font-family:var(--display);font-weight:600;font-size:2.3cqw;margin:0 0 1.2cqw;color:var(--s-fluid)}
.slide p{max-width:none;margin:0 0 1.6cqw}
.slide .s-lead{font-size:2.2cqw;line-height:1.4}
.slide .s-body{font-size:1.85cqw;line-height:1.45;color:var(--s-ink)}
.slide .s-goal{font-family:var(--display);font-weight:600;font-size:3cqw;line-height:1.2;color:var(--s-accent);margin-bottom:2.2cqw}
.slide .s-placeholder{font-size:1.8cqw;color:var(--s-muted);border:.15cqw dashed var(--s-rule);padding:1.6cqw;border-radius:.6cqw}
.slide ul{margin:0;padding-left:2.6cqw}
.slide li{max-width:none}
.slide .s-list li{font-size:1.95cqw;line-height:1.4;margin-bottom:1.1cqw}
.slide .s-big li{font-size:2.35cqw;margin-bottom:1.6cqw}
.slide .s-two{columns:2;column-gap:4cqw}
.slide .s-cols{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;align-items:start}
.slide .s-cols-wide{grid-template-columns:1.7fr 1fr}
.slide .s-fig svg{width:100%;height:auto;max-width:none}
.slide .s-fig{width:78%;margin:0 auto 2.4cqw}
.slide .s-fig svg text{font-size:14px;fill:var(--s-ink)}
.slide .s-conds{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:auto}
.slide .s-conds div{background:var(--s-soft);border-radius:.6cqw;padding:1.6cqw;font-size:1.8cqw}
.slide .s-conds b{display:block;font-family:var(--display);font-size:3.2cqw;color:var(--s-fluid);line-height:1}
.slide .s-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-bottom:3cqw}
.slide .s-stats div{background:var(--s-soft);border-radius:.6cqw;padding:1.8cqw;font-size:1.7cqw;color:var(--s-muted)}
.slide .s-stats b{display:block;font-family:var(--display);font-size:4.4cqw;line-height:1;color:var(--s-ink);margin-bottom:.6cqw}
.slide .s-timeline{display:flex;gap:.4cqw;height:3.4cqw;margin-bottom:2.4cqw}
.slide .s-timeline div{position:relative;background:var(--s-soft);border-radius:.3cqw;overflow:hidden}
.slide .s-tfill{position:absolute;left:0;top:0;bottom:0;background:var(--s-fluid)}
.slide .s-timeline i{position:relative;font-style:normal;font-size:1.2cqw;color:var(--s-ink);padding:.3cqw .6cqw;display:block;mix-blend-mode:multiply}
.slide .s-bars{display:flex;flex-direction:column;gap:1.6cqw;margin-bottom:2.4cqw}
.slide .s-barrow{display:grid;grid-template-columns:28cqw 1fr 10cqw;gap:1.6cqw;align-items:center;font-size:1.9cqw}
.slide .s-barrow div{background:var(--s-soft);height:3cqw;border-radius:.3cqw;overflow:hidden}
.slide .s-barrow i{display:block;height:100%;background:var(--s-fluid)}
.slide .s-barrow b{text-align:right;font-family:var(--display);font-size:2.4cqw}
.slide .s-swot{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1.4cqw;flex:1;min-height:0}
.slide .s-swot div{background:var(--s-soft);border-radius:.6cqw;padding:1.4cqw 1.8cqw;border-top:.5cqw solid var(--s-fluid);overflow:hidden}
.slide .s-swot div.neg{border-top-color:var(--s-accent)}
.slide .s-swot h3{font-family:var(--display);font-size:2cqw;margin:0 0 .6cqw}
.slide .s-swot li{font-size:1.25cqw;line-height:1.28;margin-bottom:.35cqw}
.slide .s-refs{padding-left:2cqw}
.slide .s-refs li{font-size:1.3cqw;line-height:1.35;margin-bottom:.7cqw}
.slide.s-title{background:#16213A;color:#FFFFFF}
.slide.s-title .s-titlewrap{margin:auto 0}
.slide .s-bar{width:9cqw;height:.8cqw;background:var(--s-accent);margin-bottom:3cqw}
.slide .s-h1{font-family:var(--display);font-weight:700;font-size:6cqw;line-height:1.02;margin:0 0 3cqw;max-width:70cqw;color:#FFFFFF}
.slide .s-by{font-size:2.8cqw;margin:0 0 1.4cqw;font-weight:600}
.slide .s-meta{font-size:1.9cqw;line-height:1.45;color:#C9D1DD}
.slide .s-event{margin-top:2cqw;color:#FFB08F}
.slide .s-thanks{list-style:none;padding:0}
.slide .s-thanks li{font-size:2.2cqw;margin-bottom:.8cqw}

/* Presenter */
#presenter{position:fixed;inset:0;z-index:50;background:#05080D;display:flex;flex-direction:column;align-items:center;justify-content:center;outline:none}
#presenter[hidden]{display:none}

const te = new TextEncoder(), td = new TextDecoder();
function bytesToB64(bytes){ let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
function b64ToBytes(b64){ const bin = atob(String(b64).replace(/\s/g,"")); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
const strToB64 = s => bytesToB64(te.encode(s));
const b64ToStr = b => td.decode(b64ToBytes(b));

async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey("raw", te.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptFor(pw, secret, iter){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt, iter);
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, te.encode(secret));
  return {salt:bytesToB64(salt), iv:bytesToB64(iv), ct:bytesToB64(new Uint8Array(ct))};
}
async function tryDecrypt(pw, u, iter){
  try {
    const key = await deriveKey(pw, b64ToBytes(u.salt), iter);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64ToBytes(u.iv)}, key, b64ToBytes(u.ct));
    return td.decode(pt);
  } catch(e){ return null; }
}

function httpErr(status){ const e = new Error("GitHub " + status); e.status = status; return e; }
function gh(path, tok, opts){
  opts = opts || {};
  return fetch("https://api.github.com" + path, {
    method: opts.method || "GET", cache: "no-store", body: opts.body,
    headers: {"Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", "Authorization":"Bearer " + tok}
  }).catch(() => { throw httpErr(0); });
}
const cPath = (cfg, p) => `/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${p.split("/").filter(Boolean).map(encodeURIComponent).join("/")}`;
async function ghGet(cfg, p, tok){
  const r = await gh(cPath(cfg, p) + "?ref=" + encodeURIComponent(cfg.branch), tok);
  if (r.status === 404) return null;
  if (!r.ok) throw httpErr(r.status);
  const j = await r.json();
  return {sha:j.sha, text:b64ToStr(j.content || "")};
}
async function ghPut(cfg, p, text, sha, message, tok){
  const body = {message, content:strToB64(text), branch:cfg.branch};
  if (sha) body.sha = sha;
  const r = await gh(cPath(cfg, p), tok, {method:"PUT", body:JSON.stringify(body)});
  if (!r.ok) throw httpErr(r.status);
  const j = await r.json();
  return j.content.sha;
}

async function loadRemote(){
  const f = await ghGet(access, access.dataPath, token);
  if (!f){ remote = normalize({}); remoteSha = null; return; }
  let parsed = {};
  try { parsed = JSON.parse(f.text); } catch(e){ parsed = {}; }
  remote = normalize(parsed); remoteSha = f.sha;
}

function mutate(fn){
  if (!token || readOnly) return;
  fn(state);
  pending.push(fn);
  stopped = false;
  setSync("dirty");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1500);
}

async function flush(){
  if (saving || !pending.length || stopped) return;
  saving = true; setSync("saving");
  const batch = pending.slice();
  let ok = false, attempt = 0;
  try {
    while (true){
      const base = clone(remote);
      batch.forEach(f => f(base));
      const file = Object.assign({version:1, updated:new Date().toISOString(), updatedBy:who.name}, base);
      try {
        remoteSha = await ghPut(access, access.dataPath, JSON.stringify(file, null, 1), remoteSha, `Tracker update by ${who.name}`, token);
        remote = normalize(base);
        break;
      } catch(e){
        if ((e.status === 409 || e.status === 422) && attempt < 3){ attempt++; await loadRemote(); continue; }
        throw e;
      }
    }
    pending = pending.slice(batch.length);
    const view = clone(remote); pending.forEach(f => f(view)); adopt(view);
    ok = true;
    hideBanner();
    setSync(pending.length ? "dirty" : "saved");
    requestRender();
  } catch(e){
    handleErr(e);
  } finally {
    saving = false;
    if (ok && pending.length) flush();
  }
}

function handleErr(e){
  const s = e && e.status;
  setSync("error");
  if (s === 401){
    stopped = true;
    showBanner("GitHub didn’t accept the access key. It may have expired. Prof. Qaissaunee can renew it by opening this page with ?setup at the end of the address.");
  } else if (s === 404){
    stopped = true;
    showBanner("The repository, branch or data file couldn’t be found with this access key. Check the setup.");
  } else if (s === 403){
    showBanner("GitHub refused the save (permissions or too many requests). Trying again in a minute.");
    retryLater(60000);
  } else {
    showBanner("Couldn’t reach GitHub. Your changes are kept on this page and will save when the connection is back.");
    retryLater(20000);
  }
}
function retryLater(ms){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { retryTimer = null; flush(); }, ms);
}

async function poll(){
  if (!token || saving || pending.length || document.hidden) return;
  try {
    const f = await ghGet(access, access.dataPath, token);
    if (f && f.sha !== remoteSha && !pending.length && !saving){
      remoteSha = f.sha;
      try { remote = normalize(JSON.parse(f.text)); } catch(e){ return; }
      adopt(clone(remote));
      requestRender();
      setSync(readOnly ? "viewonly" : "saved");
    }
  } catch(e){}
}

async function start(){

      showLogin("The saved access key no longer works. It may have expired — ask Prof. Qaissaunee to rerun setup.");

/* ---------- Schedule ---------- */
const DAY = 86400000;
function PH(){
  const o = (state.content && state.content.phaseWeeks) || {};
  return PHASES_BASE.map(p => { const w = o[p.id]; return w ? Object.assign({}, p, {s:w.s, e:w.e}) : p; });
}
function TW(){ return Math.max(1, ...PH().map(p => p.e)); }
function startOf(s){ const d = new Date(((s || state).progress.start || "2026-09-02") + "T00:00:00"); return isNaN(d) ? new Date("2026-09-02T00:00:00") : d; }
const weekStart = w => new Date(startOf().getTime() + (w - 1) * 7 * DAY);
const weekEnd = w => new Date(startOf().getTime() + (w * 7 - 1) * DAY);
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0,10); };
const fmtD = d => d.toLocaleDateString("en-US", {month:"short", day:"numeric"});
const fmtDY = d => d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
const monthYear = d => d.toLocaleDateString("en-US", {month:"long", year:"numeric"});
const phaseDates = p => `${fmtD(weekStart(p.s))} – ${fmtD(weekEnd(p.e))}`;
function dateToWeek(str, s){ const d = new Date(str + "T00:00:00"); if (isNaN(d)) return null; return Math.floor((d - startOf(s)) / (7 * DAY)) + 1; }
function milestones(){ return (C().milestones || []).filter(m => m.date).slice().sort((a,b) => a.date.localeCompare(b.date)); }
function daysUntil(str){ const d = new Date(str + "T00:00:00"); const t = new Date(); t.setHours(0,0,0,0); return Math.round((d - t) / DAY); }

/* ---------- Derived values ---------- */
function currentWeek(){
  const start = new Date((state.progress.start || "2026-09-02") + "T00:00:00");
  if (isNaN(start)) return 1;
  const now = new Date();
  return Math.floor((now - start) / (7*86400000)) + 1;
}
function ptitle(p){ return C().phaseTitle[p.id] || p.title; }
function phaseTasks(p){
  const custom = (state.progress.custom[p.id] || []).map(c => [c.id, c.text, true]);
  return p.tasks.filter(t => !C().taskHidden[t[0]]).map(t => [t[0], C().taskText[t[0]] || t[1], false]).concat(custom);
}
function phaseDone(p){
  const ts = phaseTasks(p);
  return [ts.filter(t => state.progress.tasks[t[0]]).length, ts.length];
}
function phaseStatus(p, wk){
  const [d,n] = phaseDone(p);
  if (n && d === n) return "done";
  if (wk >= p.s && wk <= p.e) return "now";
  if (wk > p.e) return "behind";
  return "later";
}
function matRow(m){
  const o = state.materials.items[m.id] || {};
  return {status:o.status || "Needed", actual:o.actual ?? "", note:o.note ?? m.note ?? ""};
}
function allMaterials(){
  const built = MATERIALS.filter(m => !(state.materials.items[m.id] || {}).hidden).map(m => {
    const o = state.materials.items[m.id] || {};
    return Object.assign({}, m, {
      name: o.name ?? m.name, link: o.link ?? m.link,
      planned: o.planned ?? m.planned, cat: o.cat ?? m.cat
    });
  });
  return built.concat((state.materials.custom || []).map(c => Object.assign({custom:true, cat:"Other", note:""}, c)));
}
function stats(){
  const wk = currentWeek();
  let done = 0, total = 0;
  PH().forEach(p => { const [d,n] = phaseDone(p); done += d; total += n; });
  const list = allMaterials();
  const mats = list.filter(m => matRow(m).status !== "Not needed");
  const received = mats.filter(m => matRow(m).status === "Received").length;
  const spent = list.reduce((s,m) => s + (Number(matRow(m).actual) || 0), 0);
  const planned = mats.reduce((s,m) => s + (Number(m.planned) || 0), 0);
  return {wk, done, total, pct: total ? Math.round(done/total*100) : 0, mats, received, spent, planned};
}
function trialSummary(){
  const t = state.logs.trials;
  const avg = (arr, k) => { const v = arr.map(x => Number(x[k])).filter(x => Number.isFinite(x) && String(x) !== ""); return v.length ? v.reduce((a,c)=>a+c,0)/v.length : NaN; };
  const byCond = CONDITIONS.map(c => { const rows = t.filter(x => x.cond === c.id); return {c, n:rows.length, grip:avg(rows,"grip"), reps:avg(rows,"reps"), hold:avg(rows,"hold"), rpe:avg(rows,"rpe")}; });
  const changes = state.logs.bench.map(x => { const off = Number(x.off), on = Number(x.on); return off > 0 && x.on !== "" && Number.isFinite(on) ? (on-off)/off*100 : NaN; }).filter(Number.isFinite);
  return {byCond, bare: byCond[0].grip, benchN: changes.length, benchAvg: changes.length ? changes.reduce((a,c)=>a+c,0)/changes.length : NaN};
}

  }
  milestones().forEach(m => {
    const days = (new Date(m.date + "T00:00:00") - startOf()) / DAY;
    if (days < 0 || days > T * 7) return;
    html += `<div class="ms" style="left:${days / (T * 7) * 100}%" title="${esc(m.label)} · ${esc(fmtDY(new Date(m.date + "T00:00:00")))}"></div>`;
  });
  track.innerHTML = html;
  const eb = document.getElementById("editToggle");
  eb.hidden = readOnly;
  eb.setAttribute("aria-pressed", String(editing));
  eb.textContent = editing ? "Done editing" : "Edit content";
  document.body.classList.toggle("editing", editing);
  document.getElementById("settingsBtn").setAttribute("aria-pressed", String(currentTab === "settings"));
}

function calcResults(){
  const dIn = SYRINGES[calc.inSz], dOut = SYRINGES[calc.outSz];
  const aIn = Math.PI * (dIn/2)**2, aOut = Math.PI * (dOut/2)**2; // mm²
  const fullStrokeOut = (Number(calc.outSz) * 1000) / aOut; // mm
  const fullStrokeIn = (Number(calc.inSz) * 1000) / aIn;
  let pressure = calc.force / aIn * 1000; // kPa (N/mm² = MPa)
  let capped = false;
  if (!calc.push){ const lim = 101 * 0.5; if (pressure > lim){ pressure = lim; capped = true; } }
  const fOut = pressure / 1000 * aOut;
  const strokeIn = Math.min(calc.stroke, fullStrokeIn);
  const strokeOut = strokeIn * aIn / aOut;
  return {aIn, aOut, pressure, psi: pressure*0.145, fOut, strokeOut, fullStrokeOut, fullStrokeIn, strokeIn, ratio:aOut/aIn, capped};
}

function vDesign(){
  const r = calcResults();
  const sizes = Object.keys(SYRINGES);
  const opt = sel => sizes.map(s => `<option value="${s}" ${s===sel?"selected":""}>${s} mL</option>`).join("");
  const warn = [];
  if (r.capped) warn.push("In pull mode the fluid can’t be pulled harder than about half an atmosphere in practice — the output force is capped, and bubbles will form near that limit. Switch to push mode.");
  if (r.psi > 90) warn.push(`Pressure is about ${fmt(r.psi,0)} psi, above the tubing’s 90 psi rating.`);
  if (r.strokeOut > r.fullStrokeOut) warn.push(`The output syringe would need to move ${fmt(r.strokeOut,0)} mm, but its full stroke is only about ${fmt(r.fullStrokeOut,0)} mm.`);
  if (r.strokeOut < calc.need) warn.push(`Output moves ${fmt(r.strokeOut,0)} mm, short of the ${calc.need} mm of string travel needed. Use a smaller output syringe or a longer input stroke.`);
  return `<h2>Design math</h2>
  <p class="lede">The questions that decide whether the device can work, and a calculator for picking syringe sizes.</p>

  <div class="grid g2">
    <div class="panel">
      <h3>Where does the energy come from?</h3>
      <p>A passive system can’t create force. It can only move energy from one place to another, or store it and give it back later. Pick one and write it down:</p>
      <p class="small"><strong>Redirect</strong> a stronger motion (wrist, elbow or shoulder) into finger flexion, like tenodesis splints and body-powered prosthetics.<br><strong>Store</strong> energy in a spring or elastic and release it while closing the hand.<br><strong>Hold</strong> a grip with a valve so muscles don’t have to keep squeezing.</p>
      <p class="small muted">If extending the same hand drives the input, the fluid pushes back on the fingers at the same moment they’re opening — the timing works against you.</p>
    </div>
    <div class="panel">
      <h3>Push, don’t pull</h3>
      <p>Pulling a plunger makes suction, and suction can never exceed about 1 atmosphere (14.7 psi). Long before that, dissolved air bubbles out and air leaks past the seal. Pushing has no such limit.</p>
      <p class="small">Mount the output syringe so its plunger pushes against a small lever or pulley that pulls the tendon string.</p>
    </div>
  </div>

  <div class="panel section">
    <h3>Push-push layout</h3>
    ${SCHEMATIC}
    <p class="small muted">Layout is illustrative; where the input is mounted depends on the energy source chosen above.</p>
  </div>

  <div class="panel section">
    <h3>Syringe calculator</h3>
    <p class="small muted">Force scales with plunger area; travel scales the other way. Results ignore seal friction and string stretch, which both reduce real output.</p>
    <div class="form">
      <div><label for="cIn">Input syringe</label><select id="cIn" data-calc="inSz">${opt(calc.inSz)}</select></div>
      <div><label for="cOut">Output syringe</label><select id="cOut" data-calc="outSz">${opt(calc.outSz)}</select></div>
      <div><label for="cF">Force on input plunger (N)</label><input type="number" id="cF" min="0" step="1" value="${calc.force}" data-calc="force"></div>
      <div><label for="cS">Input stroke (mm)</label><input type="number" id="cS" min="0" step="1" value="${calc.stroke}" data-calc="stroke"></div>
      <div><label for="cN">String travel needed (mm)</label><input type="number" id="cN" min="0" step="1" value="${calc.need}" data-calc="need"></div>
      <div><label for="cM">Mode</label><select id="cM" data-calc="push"><option value="1" ${calc.push?"selected":""}>Push (recommended)</option><option value="0" ${!calc.push?"selected":""}>Pull</option></select></div>
    </div>
    <div class="calc-out">
      <div class="stat"><div class="v">${fmt(r.fOut,1)} N</div><div class="k">Output force (${fmt(r.fOut*0.2248,1)} lb)</div></div>
      <div class="stat"><div class="v">${fmt(r.strokeOut,0)} mm</div><div class="k">Output travel</div></div>
      <div class="stat"><div class="v">${fmt(r.psi,1)} psi</div><div class="k">Line pressure</div></div>
      <div class="stat"><div class="v">×${fmt(r.ratio,2)}</div><div class="k">Force ratio (output/input)</div></div>
    </div>
    ${warn.length ? warn.map(w => `<div class="alert">${esc(w)}</div>`).join("") : `<div class="ok">This combination covers the needed travel within the tubing’s rating.</div>`}
    <p class="small muted" style="margin-top:10px">Syringe inner diameters are typical values (1 mL ≈ 4.8 mm, 10 mL ≈ 14.5 mm, 60 mL ≈ 26.7 mm). Measure your own barrels for better numbers. 10 N ≈ 2.2 lb.</p>
  </div>`;
}

            <div><button class="btn" data-action="savePw" data-key="${esc(key)}" ${dis}>Save password</button></div>
          </div></td></tr>` : ""}`;
      }).join("")}</tbody>

    <div class="form">
      <div><label for="npName">Name</label><input type="text" id="npName"></div>
      <div><label for="npRole">Access</label><select id="npRole"><option value="viewer">Viewer (read only)</option><option value="editor">Editor</option></select></div>
      <div><label for="npPw">Password (12+ characters)</label><input type="password" id="npPw" autocomplete="new-password"></div>
      <div><label for="npPw2">Confirm password</label><input type="password" id="npPw2" autocomplete="new-password"></div>
      ${hasRO ? "" : `<div class="wide"><label for="npRO">Read-only GitHub token (needed once, for the first viewer)</label><input type="password" id="npRO" autocomplete="off" placeholder="Only needed when adding a viewer"></div>`}
      <div><button class="btn" data-action="addPerson" ${dis}>Add person</button></div>
    </div>
    ${hasRO ? "" : `<p class="small muted" style="margin-top:8px">Create it like the main token (same repository) but set <strong>Contents</strong> to <strong>Read-only</strong>. Viewers’ passwords unlock this token instead of the main one, so GitHub itself refuses any change they try to make.</p>`}
    <details class="small" style="margin-top:14px"><summary>Viewer token and removing access</summary>
      <p style="margin-top:8px">Removing someone takes their password off the list. A browser where they chose “Stay signed in” keeps its key until that token is replaced, so for a clean cut-off also delete and replace the token on GitHub: the main token through <a href="?setup">setup</a> for an editor, or the read-only token below for a viewer.</p>
      <div class="form">
        <div class="wide"><label for="roNew">Replace the read-only token</label><input type="password" id="roNew" autocomplete="off"></div>

  </div>`;
}
function accessPathOf(){ return access.accessPath || access.dataPath.replace(/data\.json$/, "access.json"); }
async function checkToken(tok){
  const r = await gh(`/repos/${encodeURIComponent(access.owner)}/${encodeURIComponent(access.repo)}`, tok);
  if (r.status === 401) throw new Error("GitHub didn’t accept that token.");
  if (r.status === 404) throw new Error("That token can’t see this repository.");
  if (!r.ok) throw new Error("GitHub returned an error (" + r.status + ").");
}
async function saveAccess(next, message){
  const path = accessPathOf();
  const cur = await ghGet(access, path, token);
  await ghPut(access, path, JSON.stringify(next, null, 2), cur && cur.sha, message, token);
  access = next;
}
async function readOnlyToken(){
  if (!access.viewerKey) return null;
  return tryDecrypt(token, access.viewerKey, access.viewerKey.iterations || 100000);
}
async function passwordInUse(pw, exceptKey){
  for (const [i, u] of (access.users || []).entries()){
    const key = u.id || ("i" + i);
    if (key === exceptKey) continue;
    if (await tryDecrypt(pw, u, access.iterations || ITER)) return true;
  }
  return false;
}
function userByKey(key){ return (access.users || []).find((u, i) => (u.id || ("i" + i)) === key); }
function setPeopleMsg(t){ peopleMsg = t; const el = document.querySelector(".people .gate-msg"); if (el) el.textContent = t; }
async function peopleAction(fn){
  if (peopleBusy) return;
  peopleBusy = true; setPeopleMsg("Working…");
  document.querySelectorAll(".people button").forEach(b => b.disabled = true);
  let ok = false;
  try { const m = await fn(); peopleMsg = m || ""; ok = true; }
  catch(err){ peopleMsg = err.status === 0 ? "Couldn’t reach GitHub." : (err.status ? "GitHub returned an error (" + err.status + ")." : err.message); }
  peopleBusy = false;
  if (ok) render();
  else { setPeopleMsg(peopleMsg); document.querySelectorAll(".people button").forEach(b => b.disabled = false); }
}
function pwCheck(a, b){
  if (a.length < 12) throw new Error("Use at least 12 characters.");
  if (a !== b) throw new Error("The passwords don’t match.");
}
async function addPerson(){
  const name = val("npName"), role = val("npRole"), pw = document.getElementById("npPw").value, pw2 = document.getElementById("npPw2").value;
  const roInput = document.getElementById("npRO") ? document.getElementById("npRO").value.trim() : "";
  await peopleAction(async () => {
    if (!name) throw new Error("Enter a name.");
    pwCheck(pw, pw2);
    setPeopleMsg("Checking the password isn’t already in use…");
    if (await passwordInUse(pw)) throw new Error("Someone already uses that password. Choose another.");
    const next = clone(access);
    next.users = next.users.map((u, i) => u.id ? u : Object.assign({id:"u" + i + uid()}, u));
    let secret = token;
    if (role === "viewer"){
      secret = await readOnlyToken();
      if (!secret){
        if (!roInput) throw new Error("Paste a read-only token to add the first viewer.");
        await checkToken(roInput);
        secret = roInput;
        next.viewerKey = Object.assign({iterations:100000}, await encryptFor(token, roInput, 100000));
      }
    }
    next.users.push(Object.assign({id:"u" + uid(), name, role}, await encryptFor(pw, secret, next.iterations || ITER)));
    await saveAccess(next, `Add ${role} ${name}`);
    return `${name} added. Their password will work on other devices once GitHub Pages publishes, usually within two minutes.`;
  });
}
async function removePerson(key){
  const u = userByKey(key); if (!u || isSelf(u)) return;
  await peopleAction(async () => {
    const next = clone(access);
    next.users = next.users.filter((x, i) => (x.id || ("i" + i)) !== key);
    await saveAccess(next, `Remove ${u.name}`);
    resetFor = null;
    return `${u.name} removed.`;
  });
}
async function savePw(key){
  const u = userByKey(key); if (!u) return;
  const pw = document.getElementById("rpw1").value, pw2 = document.getElementById("rpw2").value;
  await peopleAction(async () => {
    pwCheck(pw, pw2);
    if (await passwordInUse(pw, key)) throw new Error("Someone else already uses that password. Choose another.");
    let secret = token;
    if (u.role === "viewer"){
      secret = await readOnlyToken();
      if (!secret) throw new Error("Add the read-only token first (Viewer token, below).");
    }
    const next = clone(access);
    const i = next.users.findIndex((x, j) => (x.id || ("i" + j)) === key);
    next.users[i] = Object.assign({id:u.id || ("u" + uid()), name:u.name, role:u.role}, await encryptFor(pw, secret, next.iterations || ITER));
    await saveAccess(next, `New password for ${u.name}`);
    if (isSelf(u)){ who.id = next.users[i].id; writeSession(false); }
    resetFor = null;
    return `Password saved for ${u.name}.`;
  });
}
async function replaceRO(){
  const ro = document.getElementById("roNew").value.trim();
  await peopleAction(async () => {
    if (!ro) throw new Error("Paste the new read-only token.");
    await checkToken(ro);
    const next = clone(access);
    next.viewerKey = Object.assign({iterations:100000}, await encryptFor(token, ro, 100000));
    await saveAccess(next, "Replace viewer token");
    return "Read-only token replaced. Now set a new password for each viewer.";
  });
}

      <p class="s-body">Average max grip by condition${Number.isFinite(ts.bare) ? ", with glove conditions at " + has.slice(1).map(x => Number.isFinite(x.grip) ? fmt(x.grip/ts.bare*100,0) + "%" : "–").join(" and ") + " of bare hand" : ""}. ${ts.benchN ? `Bench tests: force to close the glove changed by ${fmt(ts.benchAvg,0)}% on average with the assist on (${ts.benchN} measurement${ts.benchN>1?"s":""}).` : ""}</p>`;
  }},
  {id:"swot", name:"SWOT", fields:[], build: () => {
    const sw = C().swot;
    return `<h2 class="s-h2" style="margin-bottom:1.6cqw">SWOT analysis</h2><div class="s-swot">${["S","W","O","T"].map(k => `<div class="${k==="W"||k==="T"?"neg":""}"><h3>${QNAMES[k]}</h3><ul>${sw[k].slice(0,4).map(it => `<li>${esc(it.text)}</li>`).join("")}</ul></div>`).join("")}</div>`;
  }},
  {id:"next", name:"Challenges and next steps", fields:[["challenges","Challenges (one per line)"],["next","Next steps (one per line; blank uses upcoming phases)"]], build: () => {
    const P = C().pres, wk = currentWeek();
    const upcoming = PH().filter(p => phaseStatus(p, wk) !== "done" && p.e >= wk).slice(0,4).map(p => `Weeks ${p.s}–${p.e}: ${ptitle(p)}`).join("\n");
    return `<h2 class="s-h2">Challenges and next steps</h2>
      <div class="s-cols"><div><h3 class="s-h3">Challenges</h3>${bullets(P.challenges,"s-list") || `<p class="s-placeholder">Add the challenges you ran into.</p>`}</div>
      <div><h3 class="s-h3">Next steps</h3>${bullets(P.next || upcoming,"s-list")}</div></div>`;
  }},
  {id:"conclusions", name:"Conclusions and limitations", fields:[["conclusions","Conclusions (one per line)"],["limitations","Limitations (one per line)"]], build: () => {
    const P = C().pres;
    return `<h2 class="s-h2">Conclusions and limitations</h2>
      <div class="s-cols"><div><h3 class="s-h3">Conclusions</h3>${bullets(P.conclusions,"s-list") || `<p class="s-placeholder">Add conclusions once results are in.</p>`}</div>
      <div><h3 class="s-h3">Limitations</h3>${bullets(P.limitations,"s-list")}</div></div>`;
  }},
  {id:"terms", name:"Key terms", fields:[], build: () => {
    const t = C().glossary.filter(x => x.slide).slice(0,8);
    return `<h2 class="s-h2">Key terms</h2>${t.length ? `<dl class="s-terms">${t.map(x => `<div><dt>${esc(x.term)}</dt><dd>${esc(x.def)}</dd></div>`).join("")}</dl>` : `<p class="s-placeholder">Choose terms on the Glossary tab with “Show on Key terms slide.”</p>`}`;
  }},
  {id:"refs", name:"References", fields:[], build: () => `<h2 class="s-h2">References</h2><ul class="s-refs">${REFS.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`},
  {id:"thanks", name:"Questions", fields:[["thanks","Acknowledgments (one per line)"]], build: () => `
    <div class="s-titlewrap"><div class="s-bar"></div><h1 class="s-h1">Questions?</h1>${lines(C().pres.thanks).length ? `<p class="s-meta">Thank you to</p>${bullets(C().pres.thanks,"s-thanks")}` : ""}</div>`, cls:"s-title"}
];
function visibleSlides(){ return SLIDES.filter(s => !C().pres.hidden[s.id]); }
function slideHTML(s, n, total){
  return `<div class="slide ${s.cls||""}"><div class="s-inner">${s.build()}</div>${s.cls ? "" : slideFoot(n, total)}</div>`;
}

function vPresent(){
  const vis = visibleSlides();
  let n = 0;
  return `<h2>Presentation</h2>
  <p class="lede">Slides built from everything in the tracker. They update as the project moves along. Add the text only Cristian can supply under each slide, hide slides you don’t need, and present here or save as a PDF.</p>
  <div class="pres-tools">
    <button class="btn" data-action="present">Present</button>
    <button class="btn ghost" data-action="print">Print or save as PDF</button>
    <span class="small muted">${vis.length} of ${SLIDES.length} slides included · Arrow keys move between slides, Esc exits, N shows notes.</span>
  </div>
  <div class="slide-list">${SLIDES.map(s => {
    const on = !C().pres.hidden[s.id];
    if (on) n++;
    const P = C().pres;
    return `<div class="slide-item ${on?"":"off"}">
      <div class="slide-head">
        <label class="inline"><input type="checkbox" data-edit="slideOn:${s.id}" ${on?"checked":""}> <strong>${esc(s.name)}</strong></label>
        ${on ? `<span class="small muted">Slide ${n}</span>` : `<span class="small muted">Hidden</span>`}
      </div>
      ${on ? `<div class="slide-thumb">${slideHTML(s, n, vis.length)}</div>` : ""}
      ${on ? `<div class="slide-fields">
        ${s.fields.map(([f,label]) => `<div><label>${esc(label)}</label>${f==="event"||f==="date" ? `<input type="text" data-edit="pres:${f}" value="${esc(P[f])}">` : `<textarea rows="3" data-edit="pres:${f}">${esc(P[f])}</textarea>`}</div>`).join("")}
        ${s.id==="problem"||s.id==="goal" ? `<p class="small muted">The project summary on this slide is edited on the Overview tab.</p>` : ""}
        ${s.id==="swot" ? `<p class="small muted">Shows up to four items per box from the SWOT tab.</p>` : ""}
        ${s.id==="terms" ? `<p class="small muted">Shows up to eight terms marked on the Glossary tab.</p>` : ""}
        <div><label>Speaker notes</label><textarea rows="2" data-edit="note:${s.id}" placeholder="What to say on this slide">${esc(P.notes[s.id] || "")}</textarea></div>
      </div>` : ""}
    </div>`;
  }).join("")}</div>`;
}

/* Presenter */
let pIndex = 0, pNotes = false;
const presenter = document.getElementById("presenter");
function openPresenter(){
  pIndex = 0; pNotes = false;
  presenter.hidden = false;
  drawPresenter();
  try { if (presenter.requestFullscreen) presenter.requestFullscreen().catch(() => {}); } catch(e){}
  presenter.focus();
}
function closePresenter(){
  presenter.hidden = true;
  try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e){}
}
function drawPresenter(){
  const vis = visibleSlides();
  if (!vis.length){ closePresenter(); return; }
  pIndex = Math.max(0, Math.min(pIndex, vis.length - 1));
  const s = vis[pIndex];
  document.getElementById("pstage").innerHTML = slideHTML(s, pIndex + 1, vis.length);
  document.getElementById("pcount").textContent = `${pIndex + 1} / ${vis.length}`;
  const notes = document.getElementById("pnotes");
  notes.hidden = !pNotes;
  notes.textContent = C().pres.notes[s.id] || "No notes for this slide.";
}
document.getElementById("pPrev").addEventListener("click", () => { pIndex--; drawPresenter(); });
document.getElementById("pNext").addEventListener("click", () => { pIndex++; drawPresenter(); });
document.getElementById("pClose").addEventListener("click", closePresenter);
document.getElementById("pNotesBtn").addEventListener("click", () => { pNotes = !pNotes; drawPresenter(); });
document.getElementById("pstage").addEventListener("click", e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (e.clientX - r.left < r.width / 3) pIndex--; else pIndex++;
  drawPresenter();
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && !presenter.hidden){ /* stay open in window */ } });
document.addEventListener("keydown", e => {
  if (presenter.hidden) return;
  if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)){ e.preventDefault(); pIndex++; drawPresenter(); }
  else if (["ArrowLeft","PageUp","Backspace"].includes(e.key)){ e.preventDefault(); pIndex--; drawPresenter(); }
  else if (e.key === "Home"){ pIndex = 0; drawPresenter(); }
  else if (e.key === "End"){ pIndex = 1e6; drawPresenter(); }
  else if (e.key === "Escape"){ closePresenter(); }
  else if (e.key.toLowerCase() === "n"){ pNotes = !pNotes; drawPresenter(); }
});

function printDeck(){
  const vis = visibleSlides();
  let deck = document.getElementById("printdeck");
  if (!deck){ deck = document.createElement("div"); deck.id = "printdeck"; document.body.appendChild(deck); }
  deck.innerHTML = vis.map((s,i) => slideHTML(s, i+1, vis.length)).join("");
  document.body.classList.add("printing");
  const done = () => { document.body.classList.remove("printing"); deck.innerHTML = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(() => window.print(), 50);
}

function vNotes(){
  const entries = state.notes.entries.slice().sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.t||0)-(a.t||0));
  const today = new Date().toISOString().slice(0,10);
  return `<h2>Notes and meetings</h2>
  <p class="lede">Meeting notes, decisions, build updates, photos described in words — anything worth remembering.</p>
  ${readOnly ? "" : `<div class="panel">
    <div class="form">
      <div><label for="nD">Date</label><input type="date" id="nD" value="${today}"></div>
      <div><label>Written by</label><div style="padding:7px 0">${esc((who && who.name) || "")}</div></div>
      <div class="wide"><label for="nT">Note</label><textarea id="nT"></textarea></div>
      <div><button class="btn" data-action="addNote">Save note</button></div>
    </div>
  </div>`}
  <div class="section">${entries.length ? entries.map(n => `<div class="note"><div class="meta"><span>${esc(n.date)} · ${esc(n.author)}</span>${readOnly?"":`<button class="xbtn" data-remove-note="${n.id}">Remove</button>`}</div><div class="body">${esc(n.text)}</div></div>`).join("") : `<p class="muted">No notes yet. The first meeting is a good place to start.</p>`}</div>`;
}

/* ---------- Render ---------- */
function render(){
  renderHeader(); renderTabs();
  const views = {overview:vOverview, timeline:vTimeline, materials:vMaterials, design:vDesign, testing:vTesting, swot:vSwot, notes:vNotes, glossary:vGlossary, present:vPresent, settings:vSettings};
  document.getElementById("main").innerHTML = (views[currentTab] || vOverview)();
  if (readOnly){
    const allow = ["present","print","export","signout"];
    document.querySelectorAll("#main input, #main textarea, #main select, #main button").forEach(el => {
      if (el.dataset.calc !== undefined || allow.includes(el.dataset.action)) return;
      el.disabled = true;
    });
  }
}
function requestRender(){
  const a = document.activeElement;
  if (a && a.closest && a.closest("#main") && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox"){
    renderPending = true; return;
  }
  renderPending = false; render();
}
document.addEventListener("focusout", () => {
  if (renderPending) setTimeout(() => { if (renderPending) requestRender(); }, 0);
});

/* ---------- Events ---------- */
function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ""; }

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  currentTab = b.dataset.tab;
  try { history.replaceState(null, "", location.pathname + location.search + "#" + currentTab); } catch(_){}
  render();
  const again = document.querySelector(`[data-tab="${currentTab}"]`); if (again) again.focus();
});

const main = document.getElementById("main");
main.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.toggle){
    const key = el.dataset.toggle, on = el.checked;
    mutate(s => { if (key.startsWith("sugg:")) s.progress.sugg[key.slice(5)] = on; else s.progress.tasks[key] = on; });
    render(); return;
  }
  if (el.dataset.setting){ const k = el.dataset.setting, v = el.value; mutate(s => { s.progress[k] = v; }); render(); return; }
  if (el.dataset.mat){
    const id = el.dataset.mat, field = el.dataset.field;
    const v = field === "actual" ? (el.value === "" ? "" : Number(el.value)) : el.value;
    mutate(s => { const o = s.materials.items[id] = s.materials.items[id] || {}; o[field] = v; });
    requestRender(); return;
  }
  if (el.dataset.calc){
    const k = el.dataset.calc;
    calc[k] = k === "push" ? el.value === "1" : (k === "inSz" || k === "outSz" ? el.value : Math.max(0, Number(el.value) || 0));
    renderPending = false; render();
    const again = document.querySelector(`[data-calc="${k}"]`); if (again) again.focus();
  }
});
main.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.newtask){ e.preventDefault(); addTask(e.target.dataset.newtask); }
});
main.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.addtask) return addTask(t.dataset.addtask);
  if (t.dataset.removeTask){
    const [pid, tid] = t.dataset.removeTask.split("|");
    mutate(s => { s.progress.custom[pid] = (s.progress.custom[pid] || []).filter(x => x.id !== tid); delete s.progress.tasks[tid]; });
    render(); return;
  }
  if (t.dataset.removeMat){
    const id = t.dataset.removeMat;
    mutate(s => { s.materials.custom = s.materials.custom.filter(x => x.id !== id); delete s.materials.items[id]; });
    render(); return;
  }
  if (t.dataset.removeLog){
    const [k, id] = t.dataset.removeLog.split("|");
    mutate(s => { s.logs[k] = s.logs[k].filter(x => x.id !== id); });
    render(); return;
  }
  if (t.dataset.removeNote){
    const id = t.dataset.removeNote;
    mutate(s => { s.notes.entries = s.notes.entries.filter(x => x.id !== id); });
    render(); return;
  }
  const a = t.dataset.action;
  if (a === "addMat"){
    const name = val("nmName"); if (!name){ document.getElementById("nmName").focus(); return; }
    let link = val("nmLink"); if (link && !/^https?:\/\//i.test(link)) link = "https://" + link;
    const item = {id:"c" + uid(), name, link, planned:Number(val("nmCost")) || 0};
    mutate(s => s.materials.custom.push(clone(item))); render();
  } else if (a === "addTrial"){
    const row = {id:uid(), date:val("trD"), cond:val("trC"), grip:val("trG"), reps:val("trR"), hold:val("trH"), rpe:val("trE"), notes:val("trN")};
    if (!row.grip && !row.reps && !row.hold && !row.rpe){ document.getElementById("trG").focus(); return; }
    mutate(s => s.logs.trials.push(clone(row))); render();
  } else if (a === "addBench"){
    const row = {id:uid(), date:val("bD"), pos:val("bP"), off:val("bOff"), on:val("bOn"), notes:val("bN")};
    if (!row.off && !row.on){ document.getElementById("bOff").focus(); return; }
    mutate(s => s.logs.bench.push(clone(row))); render();
  } else if (a === "addNote"){
    const text = val("nT"); if (!text){ document.getElementById("nT").focus(); return; }
    const row = {id:uid(), t:Date.now(), date:val("nD"), author:(who && who.name) || "", text};
    mutate(s => s.notes.entries.push(clone(row))); render();
  }
});
function addTask(pid){
  const input = document.querySelector(`[data-newtask="${pid}"]`);
  const text = input ? input.value.trim() : ""; if (!text) return;
  const item = {id:"u" + uid(), text};
  mutate(s => (s.progress.custom[pid] = s.progress.custom[pid] || []).push(clone(item)));
  renderPending = false; render();
  const again = document.querySelector(`[data-newtask="${pid}"]`); if (again) again.focus();
}

/* ---------- Content editing ---------- */
function applyEdit(s, key, v){
  const [kind, a, b] = key.split(":");
  const c = s.content;
  switch(kind){
    case "summary": c.summary[a] = v; break;
    case "phase": if (v.trim()) c.phaseTitle[a] = v; else delete c.phaseTitle[a]; break;
    case "task": {
      const list = s.progress.custom[a] || [];
      const item = list.find(x => x.id === b);
      if (item) item.text = v; else c.taskText[b] = v;
      break;
    }
    case "mat": {
      const val2 = b === "planned" ? (v === "" ? 0 : Number(v)) : v;
      const item = (s.materials.custom || []).find(x => x.id === a);
      if (item) item[b] = val2;
      else { const o = s.materials.items[a] = s.materials.items[a] || {}; o[b] = val2; }
      break;
    }
    case "swot": { const it = (c.swot[a] || []).find(x => x.id === b); if (it) it.text = v; break; }
    case "sugg": { const it = c.sugg.find(x => x.id === a); if (it) it[b] = v; break; }
    case "pweek": {
      const base = PHASES_BASE.find(x => x.id === a); if (!base) break;
      const cur = Object.assign({s:base.s, e:base.e}, c.phaseWeeks[a] || {});
      const w = dateToWeek(v, s); if (w === null) break;
      cur[b] = Math.max(1, w);
      if (cur.e < cur.s){ if (b === "s") cur.e = cur.s; else cur.s = cur.e; }
      if (cur.s === base.s && cur.e === base.e) delete c.phaseWeeks[a]; else c.phaseWeeks[a] = cur;
      break;
    }
    case "ms": { const it = c.milestones.find(x => x.id === a); if (it) it[b] = v; break; }
    case "gloss": { const it = c.glossary.find(x => x.id === a); if (it) it[b] = v; break; }
    case "slideOn": if (v) delete c.pres.hidden[a]; else c.pres.hidden[a] = true; break;
    case "pres": c.pres[a] = v; break;
    case "note": c.pres.notes[a] = v; break;
  }
}
function applyDelete(s, key){
  const [kind, a, b] = key.split(":");
  const c = s.content;
  if (kind === "task"){
    const list = s.progress.custom[a] || [];
    if (list.some(x => x.id === b)) s.progress.custom[a] = list.filter(x => x.id !== b);
    else c.taskHidden[b] = true;
    delete s.progress.tasks[b];
  } else if (kind === "mat"){
    if ((s.materials.custom || []).some(x => x.id === a)){ s.materials.custom = s.materials.custom.filter(x => x.id !== a); delete s.materials.items[a]; }
    else { const o = s.materials.items[a] = s.materials.items[a] || {}; o.hidden = true; }
  } else if (kind === "swot"){
    c.swot[a] = (c.swot[a] || []).filter(x => x.id !== b);
  } else if (kind === "ms"){
    c.milestones = c.milestones.filter(x => x.id !== a);
  } else if (kind === "gloss"){
    c.glossary = c.glossary.filter(x => x.id !== a);
  } else if (kind === "sugg"){
    c.sugg = c.sugg.filter(x => x.id !== a); delete s.progress.sugg[a];
  }
}
main.addEventListener("change", e => {
  const el = e.target;
  if (!el.dataset.edit) return;
  e.stopImmediatePropagation();
  const key = el.dataset.edit, v = el.type === "checkbox" ? el.checked : el.value;
  mutate(s => applyEdit(s, key, v));
  if (el.type === "checkbox") render(); else requestRender();
}, true);
main.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.del){ const key = t.dataset.del; mutate(s => applyDelete(s, key)); render(); return; }
  if (t.dataset.add){
    const key = t.dataset.add, input = document.querySelector(`[data-addinput="${key}"]`);
    const text = input ? input.value.trim() : ""; if (!text){ if (input) input.focus(); return; }
    const q = key.split(":")[1], item = {id:q + uid(), text};
    mutate(s => { (s.content.swot[q] = s.content.swot[q] || []).push(clone(item)); });
    renderPending = false; render();
    const again = document.querySelector(`[data-addinput="${key}"]`); if (again) again.focus();
    return;
  }
  const a = t.dataset.action;
  if (a === "addSugg"){
    const text = val("nsText"); if (!text){ document.getElementById("nsText").focus(); return; }
    const item = {id:"s" + uid(), text, why:val("nsWhy"), top:document.getElementById("nsTop").checked};
    mutate(s => s.content.sugg.push(clone(item))); render();
  } else if (a === "addMs"){
    const label = val("nmsLabel"); if (!label){ document.getElementById("nmsLabel").focus(); return; }
    const item = {id:"ms" + uid(), date:val("nmsDate"), label};
    mutate(s => s.content.milestones.push(clone(item))); render();
  } else if (a === "resetSchedule"){
    mutate(s => { s.content.phaseWeeks = {}; }); render();
  } else if (a === "export"){ doExport(); }
  else if (a === "resetPw"){ resetFor = resetFor === t.dataset.key ? null : t.dataset.key; peopleMsg = ""; render(); const f = document.getElementById("rpw1"); if (f) f.focus(); }
  else if (a === "savePw"){ savePw(t.dataset.key); }
  else if (a === "removePerson"){ removePerson(t.dataset.key); }
  else if (a === "addPerson"){ addPerson(); }
  else if (a === "replaceRO"){ replaceRO(); }
  else if (a === "signout"){ signOut(); }
  else if (a === "addGloss"){
    const term = val("ngTerm"); if (!term){ document.getElementById("ngTerm").focus(); return; }
    const item = {id:"g" + uid(), cat:val("ngCat") || "Other", term, def:val("ngDef"), slide:false, done:false};
    mutate(s => s.content.glossary.push(clone(item))); render();
  } else if (a === "present"){ openPresenter(); }
  else if (a === "print"){ printDeck(); }
});
main.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset.addinput){
    e.preventDefault();
    const b = document.querySelector(`[data-add="${e.target.dataset.addinput}"]`); if (b) b.click();
  }
});
document.getElementById("editToggle").addEventListener("click", () => { editing = !editing; renderPending = false; render(); });

/* Export / import / sign out */
function doExport(){
  const blob = new Blob([JSON.stringify(Object.assign({version:1}, state), null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "eva-glove-tracker-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById("exportBtn").addEventListener("click", doExport);
async function doImport(e){
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const data = normalize(JSON.parse(await f.text()));
    mutate(s => { DOCS.forEach(d => { s[d] = clone(data[d]); }); });
    render();
  } catch(err){ showBanner("That file couldn’t be read. Choose a file made with Download backup."); }
  e.target.value = "";
}
document.getElementById("importFile").addEventListener("change", doImport);
main.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.import) doImport(e); });
document.getElementById("settingsBtn").addEventListener("click", () => { currentTab = "settings"; try { history.replaceState(null, "", location.pathname + location.search + "#settings"); } catch(_){} render(); window.scrollTo(0,0); });
document.getElementById("signout").addEventListener("click", signOut);

/* Start */
const h = (location.hash || "").slice(1);
if (TABS.some(t => t[0] === h) || h === "settings") currentTab = h;
boot();
})();
